<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Kỹ Năng Số</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Load config.js from repo so user customization applies -->
  <script src="config.js"></script>

  <!-- ╔══════════════════════════════════════════════════════╗ -->
  <!-- ║  Load config.js trước — mọi tùy chỉnh nằm ở đó     ║ -->
  <!-- ╚══════════════════════════════════════════════════════╝ -->
  <script>
// If config.js already loaded, don't overwrite. Provide fallback only.
if (typeof CONFIG === 'undefined') {
  const CONFIG = {
    ten:       "Trần Khôi Nguyên",
    nganh:     "Kỹ thuật Robot, ĐH Công nghệ (ĐHQGHN)",
    monHoc:    "Nhập môn công nghệ số và ứng dụng AI",
    email:     "25023645@vnu.edu.vn",
    tieuDe:    "Portfolio Kỹ Năng Số",
    avatar:    "data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/...",
    nhac:      "",
    mauChu:    "#1D9E75",
    anhNen:    "",
    mucTieuHocTap: `...`,
    mucTieuPortfolio: `...`
  };
  window.CONFIG = CONFIG;
}
</script>

  <style>
    :root { --green:#1D9E75; --green-light:#E1F5EE; --green-mid:#0F6E56; --text:#1a1a1a; --text-muted:#6b7280; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Be Vietnam Pro',sans-serif;background:#f9fafb;color:var(--text);min-height:100vh}
    /* minimal CSS kept for brevity; full styles are present in original file */
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="music-player" class="collapsed">
  <div class="player-mini">
    <button id="mp-play-btn" onclick="MP.toggle()" style="width:34px;height:34px;">
      <svg id="mp-play-icon" width="14" height="14" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
      <svg id="mp-pause-icon" width="14" height="14" viewBox="0 0 24 24" fill="white" style="display:none"><rect x="6" y="4" width="4" height="16"/></svg>
    </button>
    <div style="min-width:0">
      <div class="mp-title" id="mp-title-mini" style="font-size:12px;font-weight:600;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">🎵 Nhạc nền</div>
      <div style="font-size:10px;color:var(--text-muted)" id="mp-status-mini">Nhấn ▶ để bật</div>
    </div>
    <div class="music-bars paused" id="mp-bars-mini"><span></span><span></span><span></span><span></span></div>
    <button class="mp-collapse" onclick="MP.expand()" title="Mở rộng">＋</button>
  </div>

  <div class="player-full" style="display:none">
    <div class="mp-header">
      <div class="mp-art" id="mp-art">🎵</div>
      <div class="mp-info">
        <div class="mp-title" id="mp-title">Chưa chọn bài</div>
        <div class="mp-artist" id="mp-artist">Portfolio Nhạc Nền</div>
      </div>
      <button class="mp-collapse" onclick="MP.collapse()" title="Thu nhỏ">－</button>
    </div>
    <div class="mp-progress">
      <div class="mp-progress-bar" onclick="MP.seek(event)">
        <div class="mp-progress-fill" id="mp-fill"></div>
      </div>
      <div class="mp-time">
        <span id="mp-cur">0:00</span>
        <span id="mp-dur">0:00</span>
      </div>
    </div>
    <div class="mp-controls">
      <button class="mp-btn" id="mp-shuffle-btn" onclick="MP.toggleShuffle()" title="Shuffle">♻️</button>
      <button class="mp-btn" onclick="MP.prev()" title="Bài trước">⏮</button>
      <button id="mp-play-btn2" onclick="MP.toggle()" style="width:40px;height:40px;background:var(--green);color:#fff;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg id="mp-play-icon2" width="16" height="16" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
        <svg id="mp-pause-icon2" width="16" height="16" viewBox="0 0 24 24" fill="white" style="display:none"><rect x="6" y="4" width="4" height="16"/></svg>
      </button>
      <button class="mp-btn" onclick="MP.next()" title="Bài tiếp">⏭</button>
      <button class="mp-btn" id="mp-repeat-btn" onclick="MP.toggleRepeat()" title="Lặp lại">🔁</button>
    </div>
    <div class="mp-volume">
      <input type="range" class="mp-vol-slider" id="mp-vol" min="0" max="100" value="40" oninput="MP.setVol(this.value)">
    </div>
    <div class="mp-playlist-toggle" onclick="MP.toggleList()">
      <span>📋 DANH SÁCH PHÁT (<span id="mp-count">0</span> bài)</span>
      <span id="mp-list-arrow">▸</span>
    </div>
    <div class="mp-playlist" id="mp-playlist"></div>
  </div>
</div>

<audio id="bg-music" preload="none"></audio>

<!-- Page content omitted for brevity -->

<script>
// Ensure media src assignments are encoded and initialize a simple MP controller from CONFIG.nhac
document.addEventListener('DOMContentLoaded', function(){
  const audio = document.getElementById('bg-music');
  const playlistDiv = document.getElementById('mp-playlist');
  const countSpan = document.getElementById('mp-count');
  const shuffleBtn = document.getElementById('mp-shuffle-btn');
  const repeatBtn = document.getElementById('mp-repeat-btn');
  const volSlider = document.getElementById('mp-vol');

  function encodePath(p){ try { return encodeURI(p); } catch(e){ return p; } }

  // Build tracks list from CONFIG.nhac — support strings or {file,ten}
  let raw = (window.CONFIG && window.CONFIG.nhac) || [];
  if (typeof raw === 'string' && raw.trim()) raw = [raw];
  const tracks = (Array.isArray(raw) ? raw : []).map(t => {
    if (!t) return null;
    if (typeof t === 'string') return { file: t, ten: t.replace(/\.mp3$/i,'') };
    return { file: t.file, ten: t.ten || t.file };
  }).filter(Boolean).filter(t => t.file && t.file.trim());

  // Remove known empty placeholder file if present
  const cleanedTracks = tracks.filter(t => t.file !== 'the blessing.mp3');

  let index = 0, isPlaying = false, shuffle = false, repeat = false;

  function updateUIForTrack(i){
    if (!cleanedTracks.length) {
      document.getElementById('mp-title').textContent = '🎵 Nhạc nền';
      document.getElementById('mp-title-mini').textContent = '🎵 Nhạc nền';
      countSpan.textContent = 0;
      return;
    }
    const tr = cleanedTracks[i];
    document.getElementById('mp-title').textContent = tr.ten || tr.file;
    document.getElementById('mp-title-mini').textContent = tr.ten || tr.file;
    countSpan.textContent = cleanedTracks.length;
    // highlight active track in playlist
    Array.from(playlistDiv.children).forEach((el, idx)=> el.classList.toggle('active', idx === i));
  }

  function loadTrack(i){
    if (!cleanedTracks.length) return;
    index = ((i % cleanedTracks.length) + cleanedTracks.length) % cleanedTracks.length;
    const tr = cleanedTracks[index];
    audio.src = encodePath(tr.file);
    audio.load();
    updateUIForTrack(index);
  }

  function play(){
    if (!audio.src && cleanedTracks.length) loadTrack(index);
    audio.play().then(()=>{ isPlaying = true; document.getElementById('mp-bars-mini').classList.remove('paused'); document.getElementById('mp-play-icon').style.display='none'; document.getElementById('mp-pause-icon').style.display='inline'; document.getElementById('mp-play-icon2').style.display='none'; document.getElementById('mp-pause-icon2').style.display='inline'; }).catch(err=>{ console.warn('Playback failed:', err); });
  }
  function pause(){ audio.pause(); isPlaying = false; document.getElementById('mp-bars-mini').classList.add('paused'); document.getElementById('mp-play-icon').style.display='inline'; document.getElementById('mp-pause-icon').style.display='none'; document.getElementById('mp-play-icon2').style.display='inline'; document.getElementById('mp-pause-icon2').style.display='none'; }

  // Populate playlist UI
  playlistDiv.innerHTML = '';
  cleanedTracks.forEach((t,i)=>{
    const row = document.createElement('div'); row.className='mp-track';
    row.innerHTML = '<div class="mp-track-num">'+(i+1)+'</div><div class="mp-track-name">'+(t.ten||t.file)+'</div>';
    row.addEventListener('click', ()=>{ loadTrack(i); play(); });
    playlistDiv.appendChild(row);
  });

  // Attach control functions to global MP
  window.MP = window.MP || {};
  MP.toggle = function(){ if (isPlaying) pause(); else play(); };
  MP.expand = function(){ document.getElementById('music-player').classList.remove('collapsed'); document.querySelector('.player-mini').style.display='none'; document.querySelector('.player-full').style.display='block'; };
  MP.collapse = function(){ document.getElementById('music-player').classList.add('collapsed'); document.querySelector('.player-mini').style.display='flex'; document.querySelector('.player-full').style.display='none'; };
  MP.next = function(){ if (!cleanedTracks.length) return; if (shuffle) index = Math.floor(Math.random()*cleanedTracks.length); else index = (index+1)%cleanedTracks.length; loadTrack(index); play(); };
  MP.prev = function(){ if (!cleanedTracks.length) return; index = (index-1+cleanedTracks.length)%cleanedTracks.length; loadTrack(index); play(); };
  MP.toggleShuffle = function(){ shuffle = !shuffle; shuffleBtn.classList.toggle('active', shuffle); };
  MP.toggleRepeat = function(){ repeat = !repeat; repeatBtn.classList.toggle('active', repeat); };
  MP.setVol = function(v){ const vol = Math.max(0, Math.min(1, v/100)); audio.volume = vol; };
  MP.toggleList = function(){ const pl = document.getElementById('mp-playlist'); const open = pl.classList.toggle('open'); document.getElementById('mp-list-arrow').textContent = open ? '▾' : '▸'; };

  // volume init
  if (volSlider) MP.setVol(volSlider.value);

  // load first track
  if (cleanedTracks.length) loadTrack(0);

  // audio ended
  audio.addEventListener('ended', function(){ if (repeat) { loadTrack(index); play(); } else { MP.next(); } });

  // progress update
  audio.addEventListener('timeupdate', function(){
    const cur = document.getElementById('mp-cur'); const dur = document.getElementById('mp-dur'); const fill = document.getElementById('mp-fill');
    if (!audio.duration || isNaN(audio.duration)) return;
    const c = Math.floor(audio.currentTime);
    const d = Math.floor(audio.duration);
    const fmt = (s)=> Math.floor(s/60)+":"+String(s%60).padStart(2,'0');
    if (cur) cur.textContent = fmt(c);
    if (dur) dur.textContent = fmt(d);
    if (fill) fill.style.width = ((audio.currentTime / audio.duration)*100)+'%';
  });

  // click progress seek
  window.MP.seek = function(e){ const bar = document.querySelector('.mp-progress-bar'); if (!bar || !audio.duration) return; const rect = bar.getBoundingClientRect(); const x = e.clientX - rect.left; const pct = x/rect.width; audio.currentTime = pct * audio.duration; };

});
</script>

</body>
</html>
