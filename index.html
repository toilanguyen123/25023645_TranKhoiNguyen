<script>
// Small runtime fix: ensure audio src uses encodeURI when MP sets src (monkey-patch if MP exists later)
// We'll wait until DOMContentLoaded and then patch MP.setSrc if available, otherwise when MP created it should use encodeURI.
window.addEventListener('DOMContentLoaded', ()=>{
  // If MP exists and uses a setSource function, adapt; else ensure audio element is robust when src assigned elsewhere.
  const audio = document.getElementById('bg-music');
  if (!audio) return;
  // intercept setting src via a setter on the audio element
  const origSetAttribute = HTMLMediaElement.prototype.setAttribute;
  HTMLMediaElement.prototype.setAttribute = function(name, value){
    if (name === 'src' && typeof value === 'string') {
      try { value = encodeURI(value); } catch(e){}
    }
    return origSetAttribute.call(this, name, value);
  };
  // also patch assign to src property
  try {
    const desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
    if (desc && desc.set) {
      const origSetter = desc.set;
      Object.defineProperty(audio, 'src', {
        set: function(v){
          try { v = encodeURI(v); } catch(e){}
          return origSetter.call(this, v);
        }
      });
    }
  } catch(e){}
});
</script>
